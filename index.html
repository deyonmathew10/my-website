<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile System</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .navbar {
      padding: 15px;
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: 600;
      background: rgba(0,0,0,0.4);
    }

    .container {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 14px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 95%;
      padding: 10px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background: #5a67d8;
    }

    #output {
      margin-top: 15px;
      font-weight: 500;
      color: #333;
    }

    .footer {
      text-align: center;
      padding: 10px;
      color: white;
      background: rgba(0,0,0,0.4);
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="navbar">
    🎓 Student Profile System
  </div>

  <div class="container">
    <h2>Enter Student Details</h2>
    <p>This system allows users to submit and view student information.</p>

    <!-- FORM (Functional Requirement) -->
    <form onsubmit="showProfile(event)">
      <input type="text" id="name" placeholder="Enter Name" required>
      <input type="text" id="course" placeholder="Enter Course" required>
      <input type="text" id="college" placeholder="Enter College" required>

      <button type="submit">Submit</button>
    </form>

    <!-- OUTPUT -->
    <div id="output"></div>
  </div>

  <div class="footer">
    © 2026 Student Profile System
  </div>

  <script>
    function showProfile(event) {
      event.preventDefault();

      let name = document.getElementById("name").value;
      let course = document.getElementById("course").value;
      let college = document.getElementById("college").value;

      document.getElementById("output").innerHTML =
        "<h3>Student Details</h3>" +
        "Name: " + name + "<br>" +
        "Course: " + course + "<br>" +
        "College: " + college;
    }
  </script>

</body>
</html>
