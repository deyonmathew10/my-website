<!DOCTYPE html>
<html>
<head>
  <title>My First Website</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    /* Navbar */
    .navbar {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    /* Main Container */
    .container {
      margin-top: 50px;
      background: white;
      color: black;
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
      animation: fadeIn 1s ease-in-out;
    }

    /* Input */
    input {
      padding: 10px;
      width: 80%;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    /* Buttons */
    button {
      padding: 10px 15px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #764ba2;
      transform: scale(1.05);
    }

    /* Output */
    #output {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    /* Animation */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* Footer */
    .footer {
      margin-top: 50px;
      padding: 10px;
      font-size: 14px;
      background: rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    🌐 My Website
  </div>

  <!-- Main Content -->
  <div class="container">
    <h1>Welcome 👋</h1>
    <p>This is my deployed static website.</p>

    <!-- Form -->
    <form onsubmit="showMessage(event)">
      <input type="text" id="name" placeholder="Enter your name" required><br><br>
      <button type="submit">Submit</button>
    </form>

    <!-- Button -->
    <button onclick="changeText()">Click Me</button>

    <p id="output"></p>
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2026 My Website | Created by Student
  </div>

  <!-- Script -->
  <script>
    function showMessage(event) {
      event.preventDefault();
      let name = document.getElementById("name").value;
      document.getElementById("output").innerHTML = "✨ Hello, " + name + "!";
    }

    function changeText() {
      document.getElementById("output").innerHTML = "🔥 You clicked the button!";
    }
  </script>

</body>
</html>
